<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48">
  <!--
    Standalone lockup: the header's tile mark plus the wordmark. Kept in
    system-ui rather than Vazirmatn — a standalone SVG cannot rely on the
    page's webfont being loaded, and the wordmark is Latin either way.
  -->
  <rect x="2" y="4" width="40" height="40" rx="9" fill="#0e1f23"/>
  <g clip-path="url(#tile)">
    <rect x="2" y="40.7" width="40" height="3.3" fill="#fbbf24"/>
  </g>
  <path d="M10 31.3 18.8 13.7M18.8 31.3 27.6 13.7M27.6 31.3 34 18.5"
        fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
  <text x="54" y="32" font-family="system-ui, sans-serif" font-size="22" font-weight="800"
        letter-spacing="-0.4" fill="#0e1f23">ArtaClean</text>
  <clipPath id="tile">
    <rect x="2" y="4" width="40" height="40" rx="9"/>
  </clipPath>
</svg>
