<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Industrial wet and dry vacuum cleaner">
  <defs>
    <linearGradient id="cyc3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eafafc"/>
      <stop offset="1" stop-color="#c3e9f0"/>
    </linearGradient>
    <radialGradient id="spot3" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drum3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b7d84"/>
      <stop offset="0.45" stop-color="#8fa9ae"/>
      <stop offset="1" stop-color="#47656b"/>
    </linearGradient>
    <linearGradient id="head3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="body3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#375056"/>
      <stop offset="1" stop-color="#1c2f34"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#cyc3)"/>
  <ellipse cx="600" cy="300" rx="700" ry="420" fill="url(#spot3)"/>

  <g stroke="#0f7a94" stroke-opacity="0.14" stroke-width="2">
    <path d="M0 700h1200M0 758h1200"/>
    <path d="M210 690v110M520 690v110M830 690v110M1120 690v110"/>
  </g>

  <g transform="translate(392 128) scale(1.06)">

    <!--
      Suction hose: drawn before the drum so it reads as leaving the inlet and
      arcing away, rather than lying on top of the machine.
    -->
    <path d="M296 232c96-16 150 26 156 104 6 74-40 122-40 176"
          fill="none" stroke="#24393d" stroke-width="26" stroke-linecap="round"/>
    <path d="M296 232c96-16 150 26 156 104 6 74-40 122-40 176"
          fill="none" stroke="#5b7d84" stroke-width="12" stroke-linecap="round" stroke-dasharray="4 22"/>

    <!-- Floor wand at the end of the hose -->
    <path d="M412 512v42" stroke="#24393d" stroke-width="18" stroke-linecap="round"/>
    <rect x="342" y="552" width="142" height="26" rx="10" fill="url(#body3)"/>

    <!-- Motor head -->
    <path d="M96 168h200a30 30 0 0 1 30 30v66H66v-66a30 30 0 0 1 30-30Z" fill="url(#head3)"/>
    <path d="M96 168h200a30 30 0 0 1 30 30v10H66v-10a30 30 0 0 1 30-30Z" fill="#ffffff" opacity="0.42"/>
    <rect x="150" y="126" width="92" height="44" rx="16" fill="url(#body3)"/>

    <!-- Latches -->
    <rect x="60" y="268" width="26" height="40" rx="8" fill="#24393d"/>
    <rect x="306" y="268" width="26" height="40" rx="8" fill="#24393d"/>

    <!-- Stainless drum -->
    <path d="M66 264h260v210a26 26 0 0 1-26 26H92a26 26 0 0 1-26-26Z" fill="url(#drum3)"/>
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="3">
      <path d="M118 280v212M196 280v212M274 280v212"/>
    </g>
    <rect x="66" y="340" width="260" height="10" fill="#0e1f23" opacity="0.12"/>

    <!-- Castor frame -->
    <rect x="80" y="500" width="232" height="20" rx="10" fill="#24393d"/>
    <circle cx="112" cy="540" r="26" fill="#12262b"/>
    <circle cx="112" cy="540" r="11" fill="#8fa9ae"/>
    <circle cx="280" cy="540" r="26" fill="#12262b"/>
    <circle cx="280" cy="540" r="11" fill="#8fa9ae"/>
  </g>

  <ellipse cx="612" cy="712" rx="250" ry="24" fill="#0e1f23" opacity="0.22"/>
  <ellipse cx="612" cy="708" rx="150" ry="13" fill="#0e1f23" opacity="0.18"/>
</svg>
