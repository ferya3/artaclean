<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!--
    The still that carries the hero's LCP before the footage buffers. Retinted
    onto the ink ramp: it sits at 40% over an ink-950 ground, so a blue-grey
    poster put a cold cast across the one panel the palette is meant to hold.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24393d"/>
      <stop offset="1" stop-color="#071417"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <g stroke="#375056" stroke-width="2">
    <path d="M0 700h1600M0 760h1600M0 820h1600M0 880h1600"/>
    <path d="M200 640v260M500 640v260M800 640v260M1100 640v260M1400 640v260"/>
  </g>
  <rect x="620" y="470" width="360" height="180" rx="24" fill="#0e1f23" stroke="#375056" stroke-width="3"/>
  <circle cx="700" cy="670" r="42" fill="#071417" stroke="#375056" stroke-width="3"/>
  <circle cx="900" cy="670" r="42" fill="#071417" stroke="#375056" stroke-width="3"/>
</svg>
