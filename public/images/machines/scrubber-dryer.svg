<svg xmlns="http://www.w3.org/2000/svg" viewBox="179 202 849 637" width="1200" height="900" role="img" aria-label="Walk-behind scrubber dryer">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d585f"/>
      <stop offset="1" stop-color="#1a2d31"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b7d84"/>
      <stop offset="0.42" stop-color="#a8bfc4"/>
      <stop offset="1" stop-color="#47656b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22a3bf"/>
      <stop offset="1" stop-color="#11667c"/>
    </linearGradient>
  </defs>

  <!-- Contact shadow: the only thing that seats the machine on the panel. -->
  <ellipse cx="600" cy="782" rx="250" ry="27" fill="#0e1f23" opacity="0.16"/>
  <ellipse cx="600" cy="776" rx="155" ry="15" fill="#0e1f23" opacity="0.13"/>

  <!-- Push handle -->
  <path d="M686 470 852 246" stroke="#24393d" stroke-width="26" stroke-linecap="round"/>
  <path d="M800 232h104" stroke="#5b7d84" stroke-width="24" stroke-linecap="round"/>
  <rect x="762" y="272" width="118" height="68" rx="16" fill="url(#body)"/>
  <rect x="784" y="294" width="58" height="12" rx="6" fill="#3bbad0"/>
  <rect x="784" y="316" width="76" height="8" rx="4" fill="#79d5e3" opacity="0.65"/>

  <!-- Trailing squeegee -->
  <path d="M304 686h150" stroke="#24393d" stroke-width="17" stroke-linecap="round"/>
  <path d="M312 706h134" stroke="#0f7a94" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round"/>
  <circle cx="400" cy="646" r="54" fill="#12262b"/>
  <circle cx="400" cy="646" r="23" fill="#8fa9ae"/>

  <!-- Recovery tank -->
  <path d="M416 434h250a34 34 0 0 1 34 34v92H416Z" fill="url(#body)"/>
  <rect x="452" y="470" width="92" height="14" rx="7" fill="#ffffff" opacity="0.14"/>

  <!-- Solution tank -->
  <path d="M400 560h282a32 32 0 0 1 32 32v62a32 32 0 0 1-32 32H400a32 32 0 0 1-32-32v-62a32 32 0 0 1 32-32Z" fill="url(#amber)"/>
  <path d="M400 560h282a32 32 0 0 1 32 32v10H368v-10a32 32 0 0 1 32-32Z" fill="#ffffff" opacity="0.4"/>
  <rect x="424" y="612" width="122" height="16" rx="8" fill="#7c3d00" opacity="0.26"/>

  <!-- Brush deck, edge on -->
  <rect x="454" y="682" width="176" height="32" rx="13" fill="#24393d"/>
  <ellipse cx="542" cy="730" rx="90" ry="19" fill="#8fa9ae"/>
  <ellipse cx="542" cy="726" rx="52" ry="10" fill="#24393d" opacity="0.5"/>
  <circle cx="672" cy="646" r="54" fill="#12262b"/>
  <circle cx="672" cy="646" r="23" fill="#8fa9ae"/>
</svg>
