<svg xmlns="http://www.w3.org/2000/svg" viewBox="223 223 823 618" width="1200" height="900" role="img" aria-label="Industrial sweeper">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d585f"/>
      <stop offset="1" stop-color="#1a2d31"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b7d84"/>
      <stop offset="0.42" stop-color="#a8bfc4"/>
      <stop offset="1" stop-color="#47656b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22a3bf"/>
      <stop offset="1" stop-color="#11667c"/>
    </linearGradient>
  </defs>

  <!-- Contact shadow: the only thing that seats the machine on the panel. -->
  <ellipse cx="600" cy="782" rx="255" ry="27" fill="#0e1f23" opacity="0.16"/>
  <ellipse cx="600" cy="776" rx="158" ry="15" fill="#0e1f23" opacity="0.13"/>

  <!-- Handle -->
  <path d="M756 452 900 268" stroke="#24393d" stroke-width="26" stroke-linecap="round"/>
  <path d="M852 254h96" stroke="#5b7d84" stroke-width="24" stroke-linecap="round"/>

  <!-- Body and hopper -->
  <path d="M436 452h300a40 40 0 0 1 40 40v134H436Z" fill="url(#body)"/>
  <path d="M470 626h286v76a26 26 0 0 1-26 26H496a26 26 0 0 1-26-26Z" fill="url(#amber)"/>
  <rect x="500" y="486" width="150" height="18" rx="9" fill="#ffffff" opacity="0.14"/>
  <rect x="500" y="518" width="98" height="14" rx="7" fill="#3bbad0" opacity="0.6"/>

  <!-- Main brush skirt -->
  <rect x="452" y="700" width="290" height="26" rx="12" fill="#24393d"/>

  <!-- Side broom: a disc of bristles at the leading corner -->
  <g stroke="#8fa9ae" stroke-width="9" stroke-linecap="round">
    <path d="M366 660v88M322 704h88M336 672l60 60M396 672l-60 60"/>
  </g>
  <circle cx="366" cy="704" r="26" fill="#24393d"/>
  <path d="M366 626v52" stroke="#24393d" stroke-width="16" stroke-linecap="round"/>
  <path d="M366 626h96" stroke="#24393d" stroke-width="16" stroke-linecap="round"/>
  <circle cx="506" cy="706" r="52" fill="#12262b"/>
  <circle cx="506" cy="706" r="22" fill="#8fa9ae"/>
  <circle cx="716" cy="706" r="52" fill="#12262b"/>
  <circle cx="716" cy="706" r="22" fill="#8fa9ae"/>
</svg>
