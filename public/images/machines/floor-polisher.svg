<svg xmlns="http://www.w3.org/2000/svg" viewBox="198 208 836 627" width="1200" height="900" role="img" aria-label="Single disc floor polisher">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d585f"/>
      <stop offset="1" stop-color="#1a2d31"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b7d84"/>
      <stop offset="0.42" stop-color="#a8bfc4"/>
      <stop offset="1" stop-color="#47656b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22a3bf"/>
      <stop offset="1" stop-color="#11667c"/>
    </linearGradient>
  </defs>

  <!-- Contact shadow: the only thing that seats the machine on the panel. -->
  <ellipse cx="600" cy="782" rx="210" ry="24" fill="#0e1f23" opacity="0.16"/>
  <ellipse cx="600" cy="776" rx="130" ry="13" fill="#0e1f23" opacity="0.13"/>

  <!-- Handle -->
  <path d="M600 470 782 250" stroke="#24393d" stroke-width="24" stroke-linecap="round"/>
  <path d="M726 236h116" stroke="#5b7d84" stroke-width="24" stroke-linecap="round"/>
  <path d="M742 262h84" stroke="#24393d" stroke-width="14" stroke-linecap="round"/>
  <rect x="702" y="292" width="104" height="56" rx="14" fill="url(#body)"/>
  <circle cx="754" cy="320" r="13" fill="#fbbf24"/>

  <!-- Cable hooked on the handle -->
  <path d="M700 320c-60 22-78 66-64 118" fill="none" stroke="#24393d" stroke-width="9" stroke-linecap="round" opacity="0.6"/>

  <!-- Motor housing -->
  <rect x="466" y="392" width="268" height="150" rx="40" fill="url(#body)"/>
  <rect x="466" y="392" width="268" height="42" rx="21" fill="#ffffff" opacity="0.12"/>
  <rect x="500" y="452" width="118" height="18" rx="9" fill="#8fa9ae" opacity="0.5"/>

  <!-- Skirt and pad -->
  <path d="M446 542h308l-26 84H472Z" fill="url(#amber)"/>
  <ellipse cx="600" cy="654" rx="196" ry="52" fill="#24393d"/>
  <ellipse cx="600" cy="642" rx="196" ry="52" fill="url(#steel)"/>
  <ellipse cx="600" cy="642" rx="140" ry="36" fill="#0e1f23" opacity="0.18"/>
  <ellipse cx="600" cy="638" rx="74" ry="19" fill="#fbbf24" opacity="0.85"/>
  <circle cx="432" cy="620" r="34" fill="#12262b"/>
  <circle cx="432" cy="620" r="13" fill="#8fa9ae"/>
  <circle cx="768" cy="620" r="34" fill="#12262b"/>
  <circle cx="768" cy="620" r="13" fill="#8fa9ae"/>
</svg>
