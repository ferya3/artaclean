<svg xmlns="http://www.w3.org/2000/svg" viewBox="234 260 768 576" width="1200" height="900" role="img" aria-label="Industrial vacuum cleaner">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d585f"/>
      <stop offset="1" stop-color="#1a2d31"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b7d84"/>
      <stop offset="0.42" stop-color="#a8bfc4"/>
      <stop offset="1" stop-color="#47656b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22a3bf"/>
      <stop offset="1" stop-color="#11667c"/>
    </linearGradient>
  </defs>

  <!-- Contact shadow: the only thing that seats the machine on the panel. -->
  <ellipse cx="600" cy="782" rx="230" ry="26" fill="#0e1f23" opacity="0.16"/>
  <ellipse cx="600" cy="776" rx="143" ry="14" fill="#0e1f23" opacity="0.13"/>

  <!-- Suction hose, drawn first so it leaves the inlet rather than lying on top -->
  <path d="M742 372c104-8 158 44 156 122-2 78-52 118-52 186"
        fill="none" stroke="#24393d" stroke-width="30" stroke-linecap="round"/>
  <path d="M742 372c104-8 158 44 156 122-2 78-52 118-52 186"
        fill="none" stroke="#6d8b92" stroke-width="13" stroke-linecap="round" stroke-dasharray="4 24"/>
  <rect x="806" y="676" width="80" height="26" rx="12" fill="url(#body)"/>

  <!-- Motor head -->
  <rect x="352" y="352" width="400" height="118" rx="34" fill="url(#amber)"/>
  <rect x="352" y="352" width="400" height="34" rx="17" fill="#ffffff" opacity="0.42"/>
  <rect x="418" y="288" width="106" height="68" rx="22" fill="url(#body)"/>
  <rect x="580" y="288" width="106" height="68" rx="22" fill="url(#body)"/>

  <!-- Latches -->
  <rect x="338" y="472" width="30" height="52" rx="10" fill="#24393d"/>
  <rect x="736" y="472" width="30" height="52" rx="10" fill="#24393d"/>

  <!-- Stainless drum -->
  <path d="M356 466h392v230a34 34 0 0 1-34 34H390a34 34 0 0 1-34-34Z" fill="url(#steel)"/>
  <g stroke="#ffffff" stroke-opacity="0.32" stroke-width="4">
    <path d="M436 486v230M552 486v230M668 486v230"/>
  </g>
  <rect x="356" y="556" width="392" height="12" fill="#0e1f23" opacity="0.10"/>

  <!-- Castor frame -->
  <rect x="376" y="718" width="352" height="24" rx="12" fill="#24393d"/>
  <path d="M421 720h18v18h-18Z" fill="#24393d"/>
  <circle cx="430" cy="762" r="26" fill="#12262b"/>
  <circle cx="430" cy="762" r="10" fill="#8fa9ae"/>
  <path d="M665 720h18v18h-18Z" fill="#24393d"/>
  <circle cx="674" cy="762" r="26" fill="#12262b"/>
  <circle cx="674" cy="762" r="10" fill="#8fa9ae"/>
</svg>
