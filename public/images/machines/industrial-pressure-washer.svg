<svg xmlns="http://www.w3.org/2000/svg" viewBox="193 193 858 644" width="1200" height="900" role="img" aria-label="Industrial pressure washer">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d585f"/>
      <stop offset="1" stop-color="#1a2d31"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b7d84"/>
      <stop offset="0.42" stop-color="#a8bfc4"/>
      <stop offset="1" stop-color="#47656b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22a3bf"/>
      <stop offset="1" stop-color="#11667c"/>
    </linearGradient>
  </defs>

  <!-- Contact shadow: the only thing that seats the machine on the panel. -->
  <ellipse cx="600" cy="782" rx="215" ry="25" fill="#0e1f23" opacity="0.16"/>
  <ellipse cx="600" cy="776" rx="133" ry="14" fill="#0e1f23" opacity="0.13"/>

  <!-- Handle -->
  <path d="M470 452V286" stroke="#24393d" stroke-width="24" stroke-linecap="round"/>
  <path d="M458 272h122" stroke="#5b7d84" stroke-width="24" stroke-linecap="round"/>

  <!-- Lance resting against the frame -->
  <path d="M812 306 700 590" stroke="#5b7d84" stroke-width="16" stroke-linecap="round"/>
  <rect x="768" y="252" width="72" height="64" rx="18" transform="rotate(22 804 284)" fill="url(#body)"/>
  <path d="M836 246l52-24" stroke="#24393d" stroke-width="14" stroke-linecap="round"/>

  <!-- Coiled hose -->
  <g fill="none" stroke="#24393d" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <circle cx="700" cy="470" r="62"/>
    <circle cx="700" cy="470" r="34"/>
  </g>

  <!-- Body -->
  <path d="M392 452h326a36 36 0 0 1 36 36v170a36 36 0 0 1-36 36H392a36 36 0 0 1-36-36V488a36 36 0 0 1 36-36Z" fill="url(#body)"/>
  <path d="M392 452h130v242H392a36 36 0 0 1-36-36V488a36 36 0 0 1 36-36Z" fill="url(#amber)"/>
  <circle cx="456" cy="560" r="40" fill="#0e1f23" opacity="0.25"/>
  <circle cx="456" cy="560" r="26" fill="#ffffff" opacity="0.75"/>
  <path d="M456 560l16-16" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
  <rect x="566" y="512" width="122" height="16" rx="8" fill="#ffffff" opacity="0.16"/>
  <rect x="566" y="546" width="86" height="12" rx="6" fill="#3bbad0" opacity="0.6"/>
  <circle cx="430" cy="726" r="48" fill="#12262b"/>
  <circle cx="430" cy="726" r="20" fill="#8fa9ae"/>
  <circle cx="692" cy="726" r="48" fill="#12262b"/>
  <circle cx="692" cy="726" r="20" fill="#8fa9ae"/>
</svg>
