<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Industrial ride-on scrubber dryer">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b25"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c020"/>
      <stop offset="1" stop-color="#d19a06"/>
    </linearGradient>
    <linearGradient id="bodyDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3542"/>
      <stop offset="1" stop-color="#1a212b"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4553"/>
      <stop offset="1" stop-color="#222a35"/>
    </linearGradient>
    <linearGradient id="wet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3286fc" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#59aaff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#59aaff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="key" cx="0.5" cy="0.35" r="0.62">
      <stop offset="0" stop-color="#59aaff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#59aaff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#floor)"/>
  <rect width="1200" height="800" fill="url(#key)"/>

  <!-- Floor grid, converging slightly to give the plane some depth -->
  <g stroke="#2b3542" stroke-width="1.5" opacity="0.55">
    <path d="M0 596h1200M0 646h1200M0 700h1200M0 758h1200"/>
    <path d="M150 570v230M370 570v230M600 570v230M830 570v230M1050 570v230"/>
  </g>

  <!-- The cleaned pass the machine has just laid down -->
  <path d="M120 690h700l-40 96H150Z" fill="url(#wet)"/>
  <path d="M120 690h700" stroke="#59aaff" stroke-opacity="0.28" stroke-width="2"/>

  <g transform="translate(560 168)">
    <!-- Recovery tank -->
    <path d="M96 92h286a34 34 0 0 1 34 34v150H96Z" fill="url(#tank)"/>
    <rect x="128" y="122" width="150" height="58" rx="10" fill="#0e141c" opacity="0.75"/>
    <rect x="140" y="134" width="60" height="10" rx="5" fill="#59aaff" opacity="0.65"/>
    <rect x="140" y="152" width="104" height="8" rx="4" fill="#8593a5" opacity="0.5"/>

    <!-- Operator column and steering -->
    <path d="M330 92V22" stroke="#2b3542" stroke-width="16" stroke-linecap="round"/>
    <path d="M286 18h92" stroke="#8593a5" stroke-width="14" stroke-linecap="round"/>
    <circle cx="332" cy="18" r="9" fill="#f4c020"/>

    <!-- Seat -->
    <path d="M150 92V46a20 20 0 0 1 20-20h44v66Z" fill="url(#bodyDark)"/>
    <rect x="120" y="76" width="110" height="22" rx="11" fill="#2b3542"/>

    <!-- Chassis -->
    <path d="M60 276h360a30 30 0 0 1 30 30v56a24 24 0 0 1-24 24H54a24 24 0 0 1-24-24v-56a30 30 0 0 1 30-30Z" fill="url(#body)"/>
    <path d="M60 276h360a30 30 0 0 1 30 30v14H30v-14a30 30 0 0 1 30-30Z" fill="#ffffff" opacity="0.14"/>

    <!-- Deck / brush housing -->
    <rect x="8" y="386" width="470" height="42" rx="14" fill="url(#bodyDark)"/>
    <rect x="30" y="428" width="426" height="16" rx="8" fill="#0e141c"/>

    <!-- Brush discs seen edge-on -->
    <g fill="#8593a5" opacity="0.85">
      <ellipse cx="140" cy="446" rx="74" ry="14"/>
      <ellipse cx="330" cy="446" rx="74" ry="14"/>
    </g>
    <g fill="#0a0e14" opacity="0.5">
      <ellipse cx="140" cy="443" rx="46" ry="8"/>
      <ellipse cx="330" cy="443" rx="46" ry="8"/>
    </g>

    <!-- Squeegee trailing behind -->
    <path d="M-16 470h150" stroke="#2b3542" stroke-width="14" stroke-linecap="round"/>
    <path d="M-10 482h138" stroke="#59aaff" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>

    <!-- Wheels -->
    <circle cx="96" cy="404" r="54" fill="#0e141c"/>
    <circle cx="96" cy="404" r="26" fill="#2b3542"/>
    <circle cx="392" cy="404" r="54" fill="#0e141c"/>
    <circle cx="392" cy="404" r="26" fill="#2b3542"/>

    <!-- Beacon -->
    <circle cx="332" cy="-2" r="7" fill="#f4c020" opacity="0.9"/>
  </g>

  <!-- Contact shadow -->
  <ellipse cx="770" cy="628" rx="300" ry="26" fill="#000000" opacity="0.45"/>
</svg>
