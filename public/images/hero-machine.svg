<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Ride-on industrial scrubber dryer">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10333c"/>
      <stop offset="0.55" stop-color="#0a2027"/>
      <stop offset="1" stop-color="#06171b"/>
    </linearGradient>
    <radialGradient id="key" cx="0.52" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#1d9db6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#1d9db6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37565e"/>
      <stop offset="1" stop-color="#1d3238"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#456a73"/>
      <stop offset="1" stop-color="#244047"/>
    </linearGradient>
    <linearGradient id="pass" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#3bbad0" stop-opacity="0.40"/>
      <stop offset="0.6" stop-color="#3bbad0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3bbad0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#ground)"/>
  <rect width="1200" height="800" fill="url(#key)"/>

  <g stroke="#1d9db6" stroke-opacity="0.10" stroke-width="1.5">
    <path d="M0 612h1200M0 686h1200M0 768h1200"/>
    <path d="M180 596v210M470 596v210M760 596v210M1040 596v210"/>
  </g>

  <!--
    Drawn strictly back to front: the wet strip the machine has just laid down,
    then the far wheel, the deck it scrubs with, the body, and finally the near
    wheel. Painted in any other order the parts read as a pile of rectangles.
  -->
  <path d="M840 648H120l34 74h686Z" fill="url(#pass)"/>
  <path d="M840 648H120" stroke="#3bbad0" stroke-opacity="0.34" stroke-width="3"/>

  <g transform="translate(258 108)">

    <!-- Far wheel -->
    <circle cx="92" cy="512" r="64" fill="#0a2027"/>
    <circle cx="92" cy="512" r="29" fill="#37565e"/>

    <!-- Squeegee trailing on the side the wet strip runs -->
    <path d="M24 556h130" stroke="#244047" stroke-width="17" stroke-linecap="round"/>
    <path d="M30 574h118" stroke="#3bbad0" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>

    <!-- Scrub deck and brush discs -->
    <rect x="146" y="470" width="288" height="44" rx="15" fill="url(#shell)"/>
    <g fill="#7c979d" opacity="0.9">
      <ellipse cx="216" cy="534" rx="66" ry="15"/>
      <ellipse cx="366" cy="534" rx="66" ry="15"/>
    </g>
    <g fill="#06171b" opacity="0.55">
      <ellipse cx="216" cy="530" rx="38" ry="8"/>
      <ellipse cx="366" cy="530" rx="38" ry="8"/>
    </g>

    <!-- Solution tank: the yellow mass that gives the machine its silhouette -->
    <path d="M148 330h288a34 34 0 0 1 34 34v72a34 34 0 0 1-34 34H148a34 34 0 0 1-34-34v-72a34 34 0 0 1 34-34Z" fill="url(#deck)"/>
    <path d="M148 330h288a34 34 0 0 1 34 34v10H114v-10a34 34 0 0 1 34-34Z" fill="#ffffff" opacity="0.28"/>
    <rect x="164" y="390" width="140" height="16" rx="8" fill="#06171b" opacity="0.20"/>

    <!-- Recovery tank and console -->
    <path d="M170 150h228a40 40 0 0 1 40 40v140H170Z" fill="url(#tank)"/>
    <rect x="198" y="188" width="160" height="70" rx="12" fill="#0a2027" opacity="0.85"/>
    <rect x="216" y="206" width="74" height="12" rx="6" fill="#3bbad0" opacity="0.85"/>
    <rect x="216" y="230" width="112" height="9" rx="4.5" fill="#79d5e3" opacity="0.45"/>

    <!-- Operator seat -->
    <path d="M214 150V78a26 26 0 0 1 26-26h56v98Z" fill="url(#shell)"/>
    <rect x="182" y="128" width="128" height="26" rx="13" fill="#37565e"/>

    <!-- Steering column, wheel and beacon -->
    <path d="M400 150V64" stroke="#244047" stroke-width="20" stroke-linecap="round"/>
    <path d="M348 58h104" stroke="#8fa9ae" stroke-width="17" stroke-linecap="round"/>
    <circle cx="400" cy="30" r="13" fill="#fbbf24"/>
    <path d="M400 44v10" stroke="#8fa9ae" stroke-width="7" stroke-linecap="round"/>

    <!-- Near wheel, last so it sits in front of the deck -->
    <circle cx="486" cy="512" r="64" fill="#0a2027"/>
    <circle cx="486" cy="512" r="29" fill="#37565e"/>
  </g>

  <ellipse cx="690" cy="668" rx="310" ry="26" fill="#000000" opacity="0.55"/>
</svg>
