<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Ride-on industrial scrubber dryer">
  <defs>
    <!--
      A studio backdrop, not a night scene. The hero ground is near-black, so
      the image has to be the bright object on the screen or it contributes
      nothing to the first impression — which is exactly how the previous
      dark-on-dark version read.
    -->
    <linearGradient id="cyc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eafafc"/>
      <stop offset="1" stop-color="#c3e9f0"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tankFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bodyFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#375056"/>
      <stop offset="1" stop-color="#1c2f34"/>
    </linearGradient>
    <linearGradient id="deckFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#47656b"/>
      <stop offset="1" stop-color="#24393d"/>
    </linearGradient>
    <linearGradient id="wet" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#0f7a94" stop-opacity="0.28"/>
      <stop offset="0.65" stop-color="#0f7a94" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0f7a94" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#cyc)"/>
  <ellipse cx="600" cy="300" rx="700" ry="420" fill="url(#spot)"/>

  <!-- Floor plane -->
  <g stroke="#0f7a94" stroke-opacity="0.14" stroke-width="2">
    <path d="M0 700h1200M0 758h1200"/>
    <path d="M210 690v110M520 690v110M830 690v110M1120 690v110"/>
  </g>

  <!-- The wet strip just laid down, trailing behind the squeegee -->
  <path d="M880 706H90l26 62h764Z" fill="url(#wet)"/>
  <path d="M880 706H90" stroke="#0f7a94" stroke-opacity="0.30" stroke-width="3"/>

  <g transform="translate(300 96) scale(1.1)">

    <!-- Far wheel -->
    <circle cx="92" cy="512" r="64" fill="#12262b"/>
    <circle cx="92" cy="512" r="29" fill="#5b7d84"/>

    <!-- Trailing squeegee -->
    <path d="M24 556h130" stroke="#24393d" stroke-width="17" stroke-linecap="round"/>
    <path d="M30 574h118" stroke="#0f7a94" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round"/>

    <!-- Scrub deck, inside the wheelbase so both wheels read -->
    <rect x="146" y="470" width="288" height="44" rx="15" fill="url(#deckFill)"/>
    <g fill="#8fa9ae">
      <ellipse cx="216" cy="534" rx="66" ry="15"/>
      <ellipse cx="366" cy="534" rx="66" ry="15"/>
    </g>
    <g fill="#24393d" opacity="0.55">
      <ellipse cx="216" cy="530" rx="38" ry="8"/>
      <ellipse cx="366" cy="530" rx="38" ry="8"/>
    </g>

    <!-- Solution tank: the mass that gives the machine its silhouette -->
    <path d="M148 330h288a34 34 0 0 1 34 34v72a34 34 0 0 1-34 34H148a34 34 0 0 1-34-34v-72a34 34 0 0 1 34-34Z" fill="url(#tankFill)"/>
    <path d="M148 330h288a34 34 0 0 1 34 34v10H114v-10a34 34 0 0 1 34-34Z" fill="#ffffff" opacity="0.4"/>
    <rect x="164" y="390" width="140" height="16" rx="8" fill="#7c3d00" opacity="0.28"/>

    <!-- Recovery tank and console -->
    <path d="M170 150h228a40 40 0 0 1 40 40v140H170Z" fill="url(#bodyFill)"/>
    <rect x="198" y="188" width="160" height="70" rx="12" fill="#0b181c"/>
    <rect x="216" y="206" width="74" height="12" rx="6" fill="#3bbad0"/>
    <rect x="216" y="230" width="112" height="9" rx="4.5" fill="#79d5e3" opacity="0.6"/>

    <!-- Operator seat -->
    <path d="M214 150V78a26 26 0 0 1 26-26h56v98Z" fill="url(#bodyFill)"/>
    <rect x="182" y="128" width="128" height="26" rx="13" fill="#47656b"/>

    <!-- Steering column, wheel and beacon -->
    <path d="M400 150V64" stroke="#24393d" stroke-width="20" stroke-linecap="round"/>
    <path d="M348 58h104" stroke="#5b7d84" stroke-width="17" stroke-linecap="round"/>
    <circle cx="400" cy="30" r="14" fill="#f59e0b"/>
    <path d="M400 44v10" stroke="#5b7d84" stroke-width="7" stroke-linecap="round"/>

    <!-- Near wheel, drawn last so it sits in front of the deck -->
    <circle cx="486" cy="512" r="64" fill="#12262b"/>
    <circle cx="486" cy="512" r="29" fill="#5b7d84"/>
  </g>

  <!-- Contact shadow grounds the machine on the plane -->
  <ellipse cx="620" cy="704" rx="300" ry="26" fill="#0e1f23" opacity="0.22"/>
  <ellipse cx="620" cy="700" rx="190" ry="14" fill="#0e1f23" opacity="0.18"/>
</svg>
