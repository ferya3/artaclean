<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The same mark the header carries: three raked sweep strokes on a dark
    tile with an accent base. The previous icon was an "A" triangle in the
    palette the site no longer uses.
  -->
  <rect width="32" height="32" rx="7" fill="#0e1f23"/>
  <g clip-path="url(#tile)">
    <rect x="0" y="29" width="32" height="3" fill="#fbbf24"/>
  </g>
  <path d="M5.1 23.5 13.1 7.5M13.1 23.5 21.1 7.5M21.1 23.5 26.9 11.9"
        fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
  <clipPath id="tile">
    <rect width="32" height="32" rx="7"/>
  </clipPath>
</svg>
