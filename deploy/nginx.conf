# -----------------------------------------------------------------------------
# ArtaClean — Nginx site config
# Ubuntu 24.04 · Nginx · PHP 8.4-FPM · behind Cloudflare
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/artaclean
#   sudo ln -s /etc/nginx/sites-available/artaclean /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# -----------------------------------------------------------------------------

# Cloudflare terminates TLS, so the real visitor IP arrives in a header.
# Keep this list current: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name artaclean.ir www.artaclean.ir;
    return 301 https://artaclean.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.artaclean.ir;

    ssl_certificate     /etc/letsencrypt/live/artaclean.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artaclean.ir/privkey.pem;

    # One canonical host: www redirects to the apex.
    return 301 https://artaclean.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name artaclean.ir;

    root /var/www/artaclean/current/public;
    index index.php;

    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/artaclean.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artaclean.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-Frame-Options           "SAMEORIGIN"                    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Upload ceiling: product videos and catalog PDFs --------------------
    client_max_body_size 64M;

    # ---- Compression --------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml application/manifest+json;

    # Pre-compressed Brotli/gzip assets from `npm run build`, when present.
    # brotli_static on;
    gzip_static on;

    # ---- Static assets ------------------------------------------------------
    # Vite fingerprints filenames, so these are safe to cache forever.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

    # ---- Application --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME  $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT    $realpath_root;
        fastcgi_param HTTPS            on;

        fastcgi_read_timeout    300;
        fastcgi_buffer_size     32k;
        fastcgi_buffers         16 32k;
        fastcgi_hide_header     X-Powered-By;

        internal;
    }

    # Nothing else may execute PHP.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;

    access_log /var/log/nginx/artaclean.access.log;
    error_log  /var/log/nginx/artaclean.error.log warn;
}
