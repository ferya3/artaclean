# -----------------------------------------------------------------------------
# ArtaClean — Nginx site config
# Ubuntu 24.04 · Nginx · PHP 8.4-FPM · behind Cloudflare
#
# This file is HTTP-only on purpose. A fresh server has no certificate yet, so a
# config with hard-coded `ssl_certificate` paths fails `nginx -t` and blocks the
# very reload you need to get one. Run certbot once DNS points here:
#
#   sudo certbot --nginx -d artaclean.ir -d www.artaclean.ir
#
# Certbot rewrites this file in place: it adds the `listen 443 ssl` block, the
# certificate paths, and the port 80 -> 443 redirect. Nothing below needs to
# change by hand.
#
# deploy/provision.sh installs this file and substitutes __DOMAIN__ and
# __APP_ROOT__ for you.
# -----------------------------------------------------------------------------

# Cloudflare terminates TLS, so the real visitor IP arrives in a header.
# Keep this list current: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root __APP_ROOT__/public;
    index index.php;

    charset utf-8;

    # ---- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options      "nosniff"                         always;
    add_header X-Frame-Options             "SAMEORIGIN"                      always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "geolocation=(), microphone=(), camera=()" always;

    # ---- Upload ceiling: product videos and catalog PDFs --------------------
    client_max_body_size 64M;

    # ---- Compression --------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss
                    image/svg+xml application/manifest+json;
    gzip_static     on;

    # ---- Static assets ------------------------------------------------------
    # Vite fingerprints filenames, so these are safe to cache forever.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

    # ---- Application --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        fastcgi_read_timeout 300;
        fastcgi_buffer_size  32k;
        fastcgi_buffers      16 32k;
        fastcgi_hide_header  X-Powered-By;

        internal;
    }

    # Nothing else may execute PHP.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;

    access_log /var/log/nginx/artaclean.access.log;
    error_log  /var/log/nginx/artaclean.error.log warn;
}
